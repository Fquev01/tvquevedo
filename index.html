<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TV QUEVEDO Explorer</title>
  <script type="module" crossorigin src="/assets/index-DX9XVze-.js"></script>

</head>
<body>
  <header class="site-header">
    <a class="brand" href="./" aria-label="Ir al inicio">
      <span class="brand__logo">🎬</span>
      <span class="brand__name">TV QUEVEDO Explorer</span>
    </a>

    <nav class="site-nav" aria-label="Navegación principal">
      <a href="./" aria-current="page">Inicio</a>
    </nav>
  </header>


  <main class="container">
    <section class="hero">
      <h1>Busca series y mira qué se transmite hoy</h1>

      <form id="searchForm" class="search">
        <input id="query" type="search" placeholder="Ej: The Office..." required />
        <button type="submit">Buscar</button>
      </form>

      <p id="searchStatus" class="status"></p>
    </section>

    <section class="section">
      <div class="section__head">
        <h2>Resultados</h2>
        <button id="clearBtn" class="btn-secondary" type="button" hidden>Limpiar</button>
      </div>
      <div id="resultsGrid" class="grid"></div>
    </section>

    <section class="section">
      <h2>Hoy en TV (US)</h2>
      <p id="todayStatus" class="status"></p>
      <div id="todayGrid" class="grid"></div>
    </section>
  </main>

  <footer class="site-footer">
    <small>Datos: TVMaze API</small>
  </footer>

</body>
</html>
